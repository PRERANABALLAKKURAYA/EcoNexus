apiVersion: apps/v1
kind: Deployment
metadata: { name: econexus }
spec:
  replicas: 1
  selector: { matchLabels: { app: econexus } }
  template:
    metadata: { labels: { app: econexus } }
    spec:
      securityContext: { runAsNonRoot: true }
      containers:
        - name: econexus
          image: <registry>/econexus:<tag>
          ports: [{ containerPort: 8501 }]
          readinessProbe:
            httpGet: { path: /_stcore/health, port: 8501 }
            initialDelaySeconds: 5
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { memory: 1Gi }
