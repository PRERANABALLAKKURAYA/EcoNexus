seed: 42
steps: 2016              # 7 days at 5-minute intervals
interval_minutes: 5
horizon: 3               # forecast H intervals ahead
alpha: 0.70              # heating gain per kW
beta: 0.10               # cooling gain
gamma: 0.10              # neighbour exchange gain
sigma: 0.3               # noise std-dev (degC)
t_max: 95.0              # thermal-throttling ceiling (degC)
n_bursts: 40             # short random spikes (must NOT raise alarms)
train_frac: 0.70
val_frac: 0.15
surges:                  # {rack, start, length, level}
  - {rack: R4, start: 300,  length: 40, level: 0.95}
  - {rack: R2, start: 700,  length: 40, level: 0.95}
  - {rack: R5, start: 1000, length: 35, level: 0.95}
  - {rack: R1, start: 1250, length: 40, level: 0.95}
  - {rack: R6, start: 1500, length: 35, level: 0.95}
  - {rack: R4, start: 1780, length: 35, level: 0.95}
  - {rack: R3, start: 1870, length: 30, level: 0.90}
cooling_faults:          # {unit, start, length, factor}  (varied severity for coverage)
  - {unit: C1, start: 150,  length: 50, factor: 0.80}
  - {unit: C2, start: 800,  length: 60, factor: 0.60}
  - {unit: C1, start: 1300, length: 50, factor: 0.70}
  - {unit: C2, start: 1560, length: 50, factor: 0.80}
  - {unit: C2, start: 480,  length: 60, factor: 0.50}
  - {unit: C1, start: 1100, length: 60, factor: 0.50}
  - {unit: C2, start: 1380, length: 50, factor: 0.45}
  - {unit: C1, start: 1850, length: 60, factor: 0.50}
  - {unit: C2, start: 1940, length: 45, factor: 0.50}
