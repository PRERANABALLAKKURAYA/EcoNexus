<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>

*{box-sizing:border-box}html,body{margin:0;background:transparent;color:var(--text);font-family:'IBM Plex Sans',system-ui,sans-serif}
.app{height:__H__px;display:flex;flex-direction:column;gap:12px}
.head{display:flex;align-items:center;gap:14px;padding:10px 16px;border-radius:8px;border:1px solid var(--line);background:var(--panel);transition:background .4s,border-color .4s}
.head .live{font:600 10.5px 'IBM Plex Mono',monospace;letter-spacing:.12em;color:var(--hot);display:flex;align-items:center;gap:6px;white-space:nowrap}

.paused .live i{animation:none;background:var(--faint)}.paused .live{color:var(--faint)}
@keyframes blink{50%{opacity:.25}}
.head .msg{flex:1;font-size:14px;font-weight:500}.head .clock{font:600 18px 'Big Shoulders Display',sans-serif;letter-spacing:.04em;white-space:nowrap}
.head.l1{background:#2a2410;border-color:#6b5517}.head.l2{background:#2e1410;border-color:#7a2a1c}
.main{flex:1;min-height:0;display:grid;grid-template-columns:1fr 350px;gap:12px}
@media(max-width:1000px){.main{grid-template-columns:1fr}}
.col{display:flex;flex-direction:column;gap:12px;min-height:0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;display:flex;flex-direction:column;min-height:0}
.ph{display:flex;justify-content:space-between;align-items:center;padding:9px 14px;border-bottom:1px solid var(--line)}
.ph h2{font:700 15px 'Big Shoulders Display',sans-serif;letter-spacing:.06em;text-transform:uppercase;margin:0}

.floor{flex:1;min-height:0;padding:2px 6px}svg#floor{width:100%;height:100%;display:block}
.legend{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:7px 14px;border-top:1px solid var(--line);font-size:11px;color:var(--dim)}
.grad{width:110px;height:7px;border-radius:4px}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.rack{cursor:pointer}.rack .body{stroke:#000;stroke-width:1.2}.rack:hover .body{stroke:var(--text);stroke-width:2}.rack.sel .body{stroke:var(--brass);stroke-width:3.5}

</style></head><body>
<div class="app" id="app">
 <div class="head" id="head"><div class="live"><i></i><span id="livetxt">LIVE SIMULATION</span></div><div class="msg" id="msg"></div><div class="clock" id="clock"></div></div>
 <div class="main">
  <div class="col"><div class="panel" style="flex:1">
   <div class="ph"><h2>Digital twin &middot; Server hall</h2><span class="tag" id="ftag"></span></div>
   <div class="floor"><svg id="floor" viewBox="0 0 900 540" preserveAspectRatio="xMidYMid meet"></svg></div>
   <div class="legend"><span>Rack temperature:</span><span>cool</span><div class="grad" id="grad"></div><span>hot</span>
    <span><i class="dot" style="background:#4fa88c"></i>Normal</span><span><i class="dot" style="background:#e0a63e"></i>Rising risk = at/above <b id="lw"></b>&deg;C or heating fast</span><span><i class="dot" style="background:#d6472b"></i>Hotspot = predicted to reach <b id="lc"></b>&deg;C</span></div>
   <div class="tl"><svg id="tl" viewBox="0 0 600 62" preserveAspectRatio="none"></svg><div class="tlab"><span id="t0"></span><span>Hottest rack over time (red = hotspot, amber = rising risk) &middot; click to jump</span><span id="t1"></span></div></div>
   <div class="ctrl"><button class="pri" id="bPlay">&#9208; Pause</button><button id="bRe">&#8634; Restart</button><button id="bNext">&#9197; Next alert</button>
    <span class="tag" style="margin-left:8px">Speed</span><button data-sp="1" class="on">1&times;</button><button data-sp="2">2&times;</button><button data-sp="4">4&times;</button>
    <input type="range" id="scrub" min="0" value="0"></div>
  </div></div>
  <div class="col">
   <div class="panel" style="flex:1"><div class="ph"><h2>Rack inspector</h2><span class="tag" id="itag">click a rack</span></div><div class="side" id="ins"></div></div>
   <div class="panel log"><div class="ph"><h2>Event log</h2><span class="tag">click an event to jump</span></div><div class="logb" id="log"></div></div>
  </div>
 </div>
</div>
<script>
(function(){

 if(w<1){const m=[(u.cx+B[0])/2,(u.cy+B[1])/2];T(m[0],m[1]-3,Math.round(w*100)+'% of airflow',{fill:'#5a706a','font-family':MONO,'font-size':8.5,'text-anchor':'middle'},eL)}}));

 T(RW-16,RH-44,'IN NEXT '+D.horizon_min+' MIN',{fill:'#8ba39c','font-family':MONO,'font-size':8,'text-anchor':'end'},g);
 const pk=T(RW-16,RH-22,'',{'font-family':BIG,'font-size':19,'font-weight':700,'text-anchor':'end'},g);

// cooling units

const fm=v=>(v>0?'+':'')+v.toFixed(1),bar=(l,v,c,t)=>'<div class="g"><span>'+l+'</span><div class="bar"><i style="width:'+Math.round(Math.max(0,Math.min(1,v))*100)+'%;background:'+c+'"></i></div><span style="font-family:'+MONO+'">'+t+'</span></div>';
function spark(j){const w=318,h=96,p=8,hist=D.hist0[R[j].id].concat(F.slice(0,idx+1).map(f=>f.r[j].T)).slice(-36),fc=F[idx].r[j].F,v=hist.concat(fc),n=v.length;
 const lo=Math.min(...v,W-6),hi=Math.max(...v,C+3),x=i=>p+i*(w-2*p)/(n-1),y=t=>h-p-(t-lo)/(hi-lo)*(h-2*p),H=hist.length;

 '<line x1="0" x2="'+w+'" y1="'+y(C)+'" y2="'+y(C)+'" stroke="#d6472b" stroke-dasharray="3 3" opacity=".7"/><text x="3" y="'+(y(C)-3)+'" fill="#d6472b" font-size="8" font-family="IBM Plex Mono" stroke="#0e1b19" stroke-width="3" paint-order="stroke">critical '+C+'\u00B0</text>'+
 '<polyline points="'+hp+'" fill="none" stroke="#6fb1e6" stroke-width="2"/><polyline points="'+fp+'" fill="none" stroke="#ff6a4d" stroke-width="2.5" stroke-dasharray="4 3"/><circle cx="'+x(H-1)+'" cy="'+y(hist[H-1])+'" r="3.5" fill="#fff"/><circle cx="'+x(n-1)+'" cy="'+y(fc[fc.length-1])+'" r="3.5" fill="#ff6a4d"/></svg>'}
function inspector(){const j=sel,r=F[idx].r[j],id=R[j].id,c=LC[r.L];
 let h='<div class="sb"><div class="rt">'+id+' &middot; ZONE '+R[j].zone+'</div><div style="display:flex;align-items:flex-end;justify-content:space-between;margin-top:4px"><div class="temp">'+r.T.toFixed(1)+'<small> \u00B0C</small></div>'+
 '<span class="badge" style="background:'+c+'22;color:'+c+';border:1px solid '+c+'66">'+LI[r.L]+' '+LT[r.L]+'</span></div>'+
 '<div class="sub">Expected to peak at <b>'+r.P.toFixed(1)+'\u00B0C</b> within the next '+D.horizon_min+' min \u00B7 '+(r.SL>0.15?'heating up':(r.SL<-0.15?'cooling down':'steady'))+' ('+fm(r.SL)+' \u00B0C per 5 min)</div>'+
 '<div class="sec">Temperature: past and forecast</div>'+spark(j)+'<div class="sub" style="display:flex;gap:14px;margin-top:2px"><span><i class="dot" style="background:#6fb1e6"></i>measured</span><span><i class="dot" style="background:#ff6a4d"></i>model forecast</span></div>'+
 '<div class="sec">What is driving it</div>'+bar('Workload',r.UR,'#6fb1e6',Math.round(r.UR*100)+'%')+bar('Cooling it gets',r.C,r.C<0.8?'#e0a63e':'#4fa88c',Math.round(r.C*100)+'%')+
 bar('Heat from neighbours',(r.N-18)/(C-18),'#c08552',r.N.toFixed(0)+'\u00B0')+bar('Overall risk',r.S,r.S>.6?'#d6472b':(r.S>.35?'#e0a63e':'#4fa88c'),Math.round(r.S*100)+'%')+
 '<div class="sec">Why</div><div class="why">'+r.W+'</div>'+r.RS.map(x=>'<div class="rs"><b>'+x[0]+'</b>'+x[1]+'<div>'+x[2]+'</div></div>').join('')+
 '<div class="sec">What to do</div>';
 if(r.L===0)h+='<div class="why" style="color:var(--dim)">Nothing to do. This rack is within normal limits.</div>';
 else h+=r.RC.map((x,i)=>{const key=id+x[0],o=open===key;let tb='';
  if(o){tb='<table class="cmp"><tr><th>Rack</th><th>Peak now</th><th>If done</th></tr>'+R.map((q,k)=>{const b=F[idx].r[k].BP,a=x[7][k],d=a-b;return '<tr><td>'+q.id+'</td><td>'+b.toFixed(1)+'\u00B0</td><td style="color:'+(d<-.05?'#7fe0c4':(d>.05?'#e0a63e':'#8ba39c'))+'">'+a.toFixed(1)+'\u00B0 ('+fm(d)+')</td></tr>'}).join('')+'</table>'}
  return '<div class="rec" data-k="'+key.replace(/"/g,'')+'"><div class="t">'+(i+1)+'. '+x[0]+'</div><div class="j">'+x[2]+'</div>'+(x[6]!=='monitor'?'<span class="chip">peak '+fm(x[3])+'\u00B0C</span><span class="chip">in '+D.horizon_min+' min '+fm(x[4])+'\u00B0C</span>':'')+(x[5].length?'<span class="chip w">\u26A0 '+x[5].join(', ')+' riskier</span>':'')+(x[6]!=='monitor'?'<div class="tag" style="margin-top:6px">'+(o?'\u25B4 hide':'\u25BE show effect on every rack')+'</div>':'')+tb+'</div>'}).join('');
 h+='<div class="note">To test, accept or reject an action, open the <b>What-if lab</b> tab. EcoNexus only advises; it never controls equipment.</div></div>';
 const box=$('ins'),st=box.scrollTop;box.innerHTML=h;box.scrollTop=st;
 box.querySelectorAll('.rec').forEach((e,i)=>e.addEventListener('click',()=>{const x=r.RC[i];if(x[6]==='monitor')return;const key=id+x[0];open=open===key?null:key;inspector()}));
 $('itag').textContent=id+' \u00B7 zone '+R[j].zone}
function draw(snap){const f=F[idx];
 f.r.forEach((r,i)=>{const k=RK[i];tgt[i]=r.T;if(disp[i]===null||snap)disp[i]=r.T;
  k.g.classList.toggle('sel',i===sel);k.pulse.setAttribute('display',r.L===2?'block':'none');
  const lc=r.L===0?'#7fe0c4':(r.L===1?'#ffd36b':'#ff6a4d');k.leds.forEach((l,s)=>l.setAttribute('fill',(s%3===0&&r.L===2)?'#fff':lc));
  const on=Math.round(r.U*8);k.bars.forEach((b,s)=>b.setAttribute('width',s<on?RW-52:0));
  k.st.textContent=LI[r.L]+' '+LT[r.L];k.st.setAttribute('fill',r.L===0?'#7fe0c4':LC[r.L]);
  k.pk.textContent=r.P.toFixed(1)+'\u00B0';k.pk.setAttribute('fill',r.P>=W?'#ffb09f':'#e8e4dc');
  k.cl.textContent='\u2744 cooling '+Math.round(r.C*100)+'%';k.cl.setAttribute('fill',r.C<.8?'#ffe08a':'rgba(255,255,255,.75)')});
 f.k.forEach((kv,u)=>{const q=UK[u],deg=kv<.99,c=deg?'#e0a63e':'#8a6440';q.box.setAttribute('stroke',c);q.halo.setAttribute('fill',deg?'#e0a63e':'#3b82c4');
  q.fan.setAttribute('fill',deg?'#e0a63e':'#7cc0ff');q.fan.style.animationDuration=(5/Math.max(kv,.2))+'s';
  q.out.textContent='output '+Math.round(kv*100)+'%';q.out.setAttribute('fill',deg?'#ffd36b':'#8ba39c');
  q.stt.textContent=deg?'\u25B2 DEGRADED':'\u2714 HEALTHY';q.stt.setAttribute('fill',deg?'#e0a63e':'#4fa88c')});
 flows.forEach(o=>{const kv=f.k[o.ui],deg=kv<.99;o.ln.setAttribute('stroke',deg?'#e0a63e':'#3b82c4');o.ln.setAttribute('stroke-opacity',(.14+.3*o.w)*(deg?1.3:1));o.ln.style.animationDuration=(1.2/Math.max(kv,.25))+'s'});
 const hs=f.r.map((r,i)=>r.L===2?R[i].id:null).filter(Boolean),rr=f.r.map((r,i)=>r.L===1?R[i].id:null).filter(Boolean),deg=D.units.map((u,i)=>f.k[i]<.99?u.id+' at '+Math.round(f.k[i]*100)+'%':null).filter(Boolean);
 let m=hs.length?'<b>'+hs.length+' hotspot'+(hs.length>1?'s':'')+': '+hs.join(', ')+'</b>: predicted to reach '+C+'\u00B0C within '+D.horizon_min+' min.':(rr.length?'<b>Rising risk on '+rr.join(', ')+'.</b> Keep an eye on it.':'<b>All racks normal.</b> Temperatures are within safe limits.');
 if(deg.length)m+=' Cooling unit '+deg.join(', ')+' is running below full output.';
 $('msg').innerHTML=m;$('head').className='head'+(hs.length?' l2':(rr.length?' l1':''))+(playing?'':' paused');$('clock').textContent=fmt(f.t);
 $('scrub').value=idx;head.setAttribute('x1',tx(idx));head.setAttribute('x2',tx(idx));
 if(sel===null){let b=0;f.r.forEach((r,i)=>{if(r.S>f.r[b].S)b=i});sel=b;RK[b].g.classList.add('sel')}
 inspector();
 const ev=EV.filter(e=>e.i<=idx).slice(-8).reverse();
 $('log').innerHTML=ev.length?ev.map(e=>'<div class="ev" data-i="'+e.i+'"><time>'+fmt(F[e.i].t,1)+'</time><span>'+evText(e)+'</span></div>').join(''):'<div class="empty">No alerts yet. Press play and watch the hall.</div>';
 $('log').querySelectorAll('.ev').forEach(e=>e.addEventListener('click',()=>go(+e.dataset.i,true)))}
function go(i,snap){idx=((i%N)+N)%N;if(snap)pause();draw(!!snap)}
function tick(){if(playing){idx=(idx+1)%N;draw(false)}}
function sched(){clearInterval(timer);timer=setInterval(tick,900/speed)}
function pause(){playing=false;$('bPlay').innerHTML='\u25B6 Play';$('head').classList.add('paused');$('livetxt').textContent='PAUSED'}
function play(){playing=true;$('bPlay').innerHTML='\u23F8 Pause';$('head').classList.remove('paused');$('livetxt').textContent='LIVE SIMULATION'}
$('bPlay').onclick=()=>{playing?pause():play()};$('bRe').onclick=()=>{go(0,true);play()};
$('bNext').onclick=()=>{let n=EV.find(e=>e.i>idx&&isBad(e))||EV.find(e=>isBad(e));if(n)go(n.i,true)};
document.querySelectorAll('button[data-sp]').forEach(b=>b.onclick=()=>{speed=+b.dataset.sp;document.querySelectorAll('button[data-sp]').forEach(x=>x.classList.toggle('on',x===b));sched()});
$('scrub').max=N-1;$('scrub').oninput=e=>go(+e.target.value,true);
// smooth temperature animation (runs every screen refresh)
function anim(){RK.forEach((k,i)=>{if(disp[i]===null)return;const d=tgt[i]-disp[i];disp[i]=Math.abs(d)<.02?tgt[i]:disp[i]+d*.14;
 const c=col(disp[i]);k.body.setAttribute('fill',c);k.tt.firstChild.nodeValue=disp[i].toFixed(1);
 k.glow.setAttribute('fill',c);k.glow.setAttribute('opacity',Math.max(0,Math.min(.55,(disp[i]-(W-22))/34)))});requestAnimationFrame(anim)}
draw(true);sched();requestAnimationFrame(anim);
window.__eco={go,get idx(){return idx},pause,play};
})();
